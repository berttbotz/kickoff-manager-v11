
name: Build Kickoff Manager APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode proyek
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Siapkan Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Instal dependensi
        run: npm install

      - name: Siapkan Android
        run: npx cap add android

      - name: Sinkronkan proyek
        run: npx cap sync android

      - name: Buat APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: kickoff-manager-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
